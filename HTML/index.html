<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> Bold and Emphasis</title>
    </head>
    <body>
        <h3> Lorem Ipsum</h3>
       <p> <strong><em>Lorem ipsum dolor sit amet consectetur adipisicing elit.</em></strong></p>

       <h3>Mollitia</h3>  
       <p><strong>Mollitia, porro <em>ullam cum repudiandae</em></strong> eaque illum ex.</p>

       <h3>Voluptatibus</h3>
       <p>Voluptatibus <em>consequatur cum voluptatum,</em>
         recusandae sunt molestias,<strong> omnis dolorem nulla facere, 
         minus autem eos.</strong>
       </p>  
    </body>

</html>
